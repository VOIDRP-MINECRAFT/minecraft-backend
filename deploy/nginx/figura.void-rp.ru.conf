# Self-hosted Figura backend. Client hits https://figura.void-rp.ru/api/* (HTTP) and
# wss://figura.void-rp.ru/ws (WebSocket). We rewrite to the FastAPI backend on :8001
# (/figura/* and /figura-ws) to avoid colliding with the main /api/v1 API.
server {
    listen 80;
    listen [::]:80;
    server_name figura.void-rp.ru;
    return 301 https://figura.void-rp.ru$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name figura.void-rp.ru;

    ssl_certificate     /etc/letsencrypt/live/void-rp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/void-rp.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    # Figura HTTP API: /api/* -> backend /figura/*
    location /api/ {
        rewrite ^/api/(.*)$ /figura/$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
    }

    # Figura WebSocket: /ws -> backend /figura-ws
    location /ws {
        proxy_pass http://127.0.0.1:8001/figura-ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600;
    }
}
